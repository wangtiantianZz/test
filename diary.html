<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="生活日记详情页，阅读一段被认真保存的生活片刻。">
    <meta property="og:title" content="生活日记">

<body>
    <header class="site-hero detail-hero" id="detailHero">
        <div class="container hero-content detail-hero-content">
            <a href="index.html" class="back-btn">← 返回日记列表</a>
            <div class="hero-kicker" id="diaryDate"></div>
            <h1 id="diaryTitle"></h1>
            <p id="diarySummary"></p>
            <div class="hero-meta" id="diaryMeta"></div>
            <div class="card-tags" id="diaryTags"></div>
            <button id="themeToggle" class="theme-toggle detail-theme-toggle" type="button" aria-label="切换主题"></button>
        </div>
    </header>

    <div class="reading-progress" id="readingProgress"></div>

    <main class="container">

                <h2 class="diary-toc-title">目录</h2>

            <nav class="detail-nav" id="detailNav" aria-label="相邻日记"></nav>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>用心记录生活，用爱书写故事</p>
        </div>
    </footer>
    <button id="backToTopBtn" class="back-to-top" type="button" aria-label="回到顶部">↑</button>
