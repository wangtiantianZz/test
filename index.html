<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="生活日记，记录日常、出行、摄影与身边的温柔瞬间。">
    <meta property="og:title" content="生活日记">
    <meta property="og:description" content="把生活里的光、风、城市和陪伴整理成一本安静的线上日记。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://wangtiantian.top/images/spring-03.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://wangtiantian.top/">
    <title>生活日记</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-hero home-hero">
        <div class="container hero-content">
            <div class="hero-kicker">Private Life Journal</div>
            <h1>生活日记</h1>
            <p>把普通日子里的光、风、城市和陪伴，整理成一本安静的线上日记。</p>
            <div class="hero-meta">
                <span id="todayDisplay"></span>
                <span class="meta-sep">·</span>
                <span id="diaryCount"></span>
            </div>
            <div class="hero-actions">
                <a href="#diaryGrid" class="hero-link">浏览日记</a>
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换主题"></button>
            </div>
        </div>
    </header>

    <main>
        <section class="featured-section" aria-labelledby="featuredTitle">
            <div class="container">
                <div class="section-heading">
                    <span>Selected Moment</span>
                    <h2 id="featuredTitle">最近精选</h2>
                </div>
                <div class="featured-diary" id="featuredDiary"></div>
            </div>
        </section>

        <section class="journal-section" aria-labelledby="journalTitle">
            <div class="container">
                <div class="section-heading section-heading-inline">
                    <div>
                        <span>Archive</span>
                        <h2 id="journalTitle">日记存档</h2>
                    </div>
                    <p>按心情、地点和日期慢慢翻看。</p>
                </div>

                <div class="filter-bar">
                    <label class="search-shell" for="searchInput">
                        <span>搜索</span>
                        <input type="text" id="searchInput" placeholder="标题、摘要、地点..." />
                    </label>
                    <select id="sortSelect" class="filter-select" aria-label="按日期排序">
                        <option value="desc">最新优先</option>
                        <option value="asc">最早优先</option>
                    </select>
                    <div class="tag-list" id="tagList"></div>
                </div>

                <div class="diary-grid" id="diaryGrid"></div>
                <div class="load-more-wrap">
                    <button id="loadMoreBtn" class="load-more-btn" type="button">加载更多</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>用心记录生活，用爱书写故事</p>
        </div>
    </footer>
    <button id="backToTopBtn" class="back-to-top" type="button" aria-label="回到顶部">↑</button>

    <script src="js/main.js?v=20260604"></script>
    <script src="js/home.js?v=20260604"></script>
</body>
</html>
